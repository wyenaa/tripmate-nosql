# TripMate - konfigurasi bersama untuk neo4j1, neo4j2, neo4j3
# Satu file dipakai ketiga server. Bagian $(...) dijalankan di masing-masing
# container saat start (karena EXTENDED_CONF=yes), jadi hasilnya beda per server.
# Simpan file ini dengan line ending LF, bukan CRLF.

# Memori kecil supaya 3 server muat di 1 laptop
server.memory.pagecache.size=100M
server.memory.heap.initial_size=100M

# Discovery: server saling menemukan lewat DNS alias "neo4j-network", port 6000
dbms.cluster.discovery.resolver_type=DNS
dbms.cluster.endpoints=neo4j-network:6000

# Alamat yang diumumkan server ini ke anggota cluster lain
server.cluster.advertised_address=$(hostname -i)
server.cluster.raft.advertised_address=$(hostname)
server.routing.advertised_address=$(hostname)

# Server yang baru bergabung langsung berstatus Enabled (tanpa ENABLE SERVER manual)
initial.dbms.automatically_enable_free_servers=true
